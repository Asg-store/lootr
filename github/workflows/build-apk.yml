name: Build MgLoot APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build APK with PWABuilder
      run: |
        npx @pwabuilder/cli build android --packageId com.mgloot.app --name MgLoot
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MgLoot-App
        path: android/app/release/app-release.apk
